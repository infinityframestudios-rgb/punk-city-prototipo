<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05010a">
<title>Punk City – Prototipo di Battaglia</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#05010a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;height:100vh;height:100dvh}
#game{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}
#rot{display:none;position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a0838 0%,#05010af2 70%);color:#ff2fb3;font:bold 22px "Trebuchet MS",sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;padding:24px;gap:18px;text-shadow:0 0 12px #ff2fb3}
#rot .ico{font-size:64px;animation:spin 1.8s ease-in-out infinite}
@keyframes spin{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#rot small{color:#9fdcff;font-size:15px;text-shadow:none}
#rot button{font:bold 18px "Trebuchet MS",sans-serif;color:#fff;background:#1a0630;border:2px solid #00f0ff;border-radius:12px;padding:12px 22px;box-shadow:0 0 14px #00f0ff88}
body.portrait:not(.ok) #rot{display:flex}
</style></head><body>
<div id="game"></div>
<div id="rot"><div class="ico">📱↻</div><div>Gira il telefono in orizzontale<br>per giocare a Punk City</div><small>Il gioco si adatta da solo, senza ricaricare.</small><button id="rotok">Gioca lo stesso in verticale</button></div>
<script src="lib/phaser.min.js"></script>
<script src="audio.js?v=4"></script>
<script src="enemies.js?v=4"></script>
<script src="game.js?v=4"></script>
</body></html>
